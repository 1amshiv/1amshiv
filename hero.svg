<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Shivansh Tripathi" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
  <radialGradient id="glow" cx="82%" cy="55%" r="38%">
    <stop offset="0" stop-color="#7dcfff" stop-opacity="0.10"/>
    <stop offset="1" stop-color="#7dcfff" stop-opacity="0"/>
  </radialGradient>
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .rise { opacity: 0; animation: rise 1.5s cubic-bezier(.2,.7,.2,1) forwards; }
    .fade { opacity: 0; animation: fade 1.4s ease forwards; }
    .draw { stroke-dasharray: 1100; stroke-dashoffset: 1100; animation: draw 1.8s cubic-bezier(.65,0,.35,1) forwards; }
    .spin { transform-origin: 980px 232px; animation: spin 36s linear infinite; }
    .spin2 { transform-origin: 980px 232px; animation: spin 60s linear infinite reverse; }
    .breathe { animation: breathe 7s ease-in-out infinite; transform-origin: 980px 232px; }
    @keyframes rise { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes breathe { 0%,100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.04); opacity: 1; } }
  </style>
</defs>

<rect width="1200" height="380" fill="#0d1117"/>
<rect width="1200" height="380" fill="url(#glow)"/>

<text class="fade" style="animation-delay:.2s" x="60" y="68" font-size="12" letter-spacing="5" fill="#6e7681">PORTFOLIO / 2026</text>
<text class="fade" style="animation-delay:.4s" x="1140" y="68" font-size="12" letter-spacing="5" fill="#6e7681" text-anchor="end">1AMSHIV</text>
<line class="draw" x1="60" y1="92" x2="1140" y2="92" stroke="#30363d" stroke-width="1"/>

<g class="breathe">
  <circle cx="980" cy="232" r="92" fill="none" stroke="#7dcfff" stroke-opacity=".35" stroke-width=".8"/>
</g>
<g class="spin">
  <circle cx="980" cy="232" r="132" fill="none" stroke="#30363d" stroke-width=".8"/>
  <circle cx="980" cy="100" r="3.2" fill="#7dcfff"/>
</g>
<g class="spin2">
  <circle cx="980" cy="232" r="164" fill="none" stroke="#21262d" stroke-width=".8" stroke-dasharray="2 8"/>
  <circle cx="816" cy="232" r="2" fill="#8b949e"/>
</g>

<text class="rise" style="animation-delay:.6s" x="58" y="196" font-size="78" font-weight="300" letter-spacing="16" fill="#e6edf3">SHIVANSH</text>
<text class="rise" style="animation-delay:.95s" x="58" y="282" font-size="78" font-weight="300" letter-spacing="16" fill="#e6edf3">TRIPATHI</text>

<line class="draw" style="animation-delay:1.6s; stroke-dasharray:90; stroke-dashoffset:90" x1="60" y1="314" x2="150" y2="314" stroke="#7dcfff" stroke-width="1.2"/>
<text class="fade" style="animation-delay:2s" x="60" y="346" font-size="13" letter-spacing="5" fill="#8b949e">B.TECH CSE  <tspan fill="#7dcfff">/</tspan>  JAVA  <tspan fill="#7dcfff">/</tspan>  JAVASCRIPT  <tspan fill="#7dcfff">/</tspan>  HTML</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
