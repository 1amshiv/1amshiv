<svg width="800" height="330" viewBox="0 0 800 330" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    text { font-family: 'Courier New', Courier, monospace; font-size: 17px; }
    .p { fill: #00f5a0; }
    .c { fill: #e6edf3; }
    .o { fill: #58a6ff; }
    .t { fill: #8b949e; font-size: 13px; }
    .line { clip-path: inset(0 100% 0 0); animation-name: type; animation-fill-mode: forwards; animation-timing-function: steps(1); }
    @keyframes type { to { clip-path: inset(0 0 0 0); } }
    .cur { fill: #00f5a0; opacity: 0; animation: show 0.01s 11.6s forwards, blink 1s 11.6s steps(1) infinite; }
    @keyframes show { to { opacity: 1; } }
    @keyframes blink { 50% { opacity: 0; } }
    .glow { animation: glow 3s ease-in-out infinite; }
    @keyframes glow { 0%,100% { stroke-opacity: .35; } 50% { stroke-opacity: 1; } }
  </style>

  <rect x="10" y="10" width="780" height="310" rx="12" fill="#0d1117" stroke="#00f5a0" stroke-width="1.5" class="glow"/>
