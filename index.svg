<defs>
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .fade { opacity: 0; animation: fade 1.2s ease forwards; }
    .slide { opacity: 0; animation: slide 1.1s cubic-bezier(.2,.7,.2,1) forwards; }
    .draw { stroke-dasharray: 1100; stroke-dashoffset: 1100; animation: draw 1.6s cubic-bezier(.65,0,.35,1) forwards; }
    @keyframes fade { to { opacity: 1; } }
    @keyframes slide { from { opacity: 0; transform: translateX(-18px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
  </style>
</defs>
