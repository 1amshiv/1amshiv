<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f5a0"/>
      <stop offset="1" stop-color="#00d9f5"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f5a0" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00f5a0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#00f5a0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bottomfade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="1"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#1f2a37" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .col { font: 14px monospace; fill: #00f5a0; opacity: 0; animation: fall 7s linear infinite; }
    @keyframes fall {
      0%   { transform: translateY(-160px); opacity: 0; }
      15%  { opacity: .45; }
      85%  { opacity: .45; }
      100% { transform: translateY(300px); opacity: 0; }
    }
    .name {
      font: 800 56px 'Segoe UI', Arial, sans-serif;
      letter-spacing: 3px;
      fill: url(#g); fill-opacity: 0;
      stroke: url(#g); stroke-width: 1.6;
      stroke-dasharray: 4000; stroke-dashoffset: 4000;
      animation: draw 3s ease forwards, fillin 1s 2.6s ease forwards;
    }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes fillin { to { fill-opacity: 1; } }

    .sub {
      font: 600 20px 'Courier New', monospace; fill: #c9d1d9;
      clip-path: inset(0 100% 0 0);
      animation: type 2.4s 3.2s steps(38) forwards;
    }
    @keyframes type { to { clip-path: inset(0 0 0 0); } }

    .cursor { fill: #00f5a0; animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    .scanner { animation: sweep 5s ease-in-out infinite; }
    @keyframes sweep { 0% { transform: translateX(-300px); } 100% { transform: translateX(900px); } }

    .pulse { animation: pulse 2.5s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
  </style>

  <rect width="900" height="260" fill="#0d1117"/>
  <rect width="900" height="260" fill="url(#grid)"/>

  <!-- falling binary rain -->
  <g>
    <text class="col" x="40"  y="0" writing-mode="tb" style="animation-delay:0s">1010011010</text>
    <text class="col" x="110" y="0" writing-mode="tb" style="animation-delay:-2s">0110100101</text>
    <text class="col" x="180" y="0" writing-mode="tb" style="animation-delay:-4s">1100101001</text>
    <text class="col" x="250" y="0" writing-mode="tb" style="animation-delay:-1s">0101110010</text>
    <text class="col" x="330" y="0" writing-mode="tb" style="animation-delay:-5s">1001010110</text>
    <text class="col" x="560" y="0" writing-mode="tb" style="animation-delay:-3s">0110011001</text>
    <text class="col" x="640" y="0" writing-mode="tb" style="animation-delay:-6s">1010110100</text>
    <text class="col" x="720" y="0" writing-mode="tb" style="animation-delay:-1.5s">0011010110</text>
    <text class="col" x="800" y="0" writing-mode="tb" style="animation-delay:-4.5s">1101001011</text>
    <text class="col" x="865" y="0" writing-mode="tb" style="animation-delay:-2.5s">0100110101</text>
  </g>

  <!-- scanning beam -->
  <rect class="scanner" x="0" y="0" width="300" height="260" fill="url(#scan)"/>

  <!-- corner brackets -->
  <g class="pulse" stroke="#00f5a0" stroke-width="2" fill="none">
    <path d="M20 50V20H50"/>
    <path d="M850 20H880V50"/>
    <path d="M20 210V240H50"/>
    <path d="M850 240H880V210"/>
  </g>

  <!-- name -->
  <g filter="url(#glow)">
    <text class="name" x="450" y="125" text-anchor="middle">SHIVANSH TRIPATHI</text>
  </g>

  <!-- subtitle -->
  <text class="sub" x="450" y="175" text-anchor="middle">CSE Freshman | Web Dev | Builder</text>
  <rect class="cursor" x="640" y="158" width="10" height="22"/>

  <rect y="200" width="900" height="60" fill="url(#bottomfade)"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
