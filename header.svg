<svg width="1000" height="280" viewBox="0 0 1000 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated profile header" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b18"/>
      <stop offset="0.6" stop-color="#120e33"/>
      <stop offset="1" stop-color="#1d1146"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8c872"/>
      <stop offset="0.5" stop-color="#b79cff"/>
      <stop offset="1" stop-color="#6ee7f9"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowA"><stop offset="0" stop-color="#8b5cf6" stop-opacity="0.45"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB"><stop offset="0" stop-color="#e8c872" stop-opacity="0.30"/><stop offset="1" stop-color="#e8c872" stop-opacity="0"/></radialGradient>
    <clipPath id="typed">
      <rect x="64" y="176" height="44" width="0">
        
        <animate attributeName="width" values="0;40;80;120;160;200;240;280;320;360;400;440;480;520;560;600;640" keyTimes="0;0.0625;0.125;0.1875;0.25;0.3125;0.375;0.4375;0.5;0.5625;0.625;0.6875;0.75;0.8125;0.875;0.9375;1" calcMode="discrete" dur="3.2s" begin="1.2s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="card"><rect width="1000" height="280" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1000" height="280" fill="url(#bg)"/>

    <!-- drifting glows -->
    <circle cx="820" cy="60" r="220" fill="url(#glowA)">
      <animate attributeName="cx" values="820;760;820" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="60;110;60" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="140" cy="260" r="200" fill="url(#glowB)">
      <animate attributeName="cx" values="140;220;140" dur="17s" repeatCount="indefinite"/>
    </circle>

    <!-- constellation grid -->
    <g stroke="#ffffff" stroke-opacity="0.05">
      <path d="M0 70H1000M0 140H1000M0 210H1000"/>
      <path d="M200 0V280M400 0V280M600 0V280M800 0V280"/>
    </g>

    <!-- floating particles -->
    <g fill="#ffffff">
      <circle cx="720" cy="220" r="2"><animate attributeName="cy" values="260;20" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="9s" repeatCount="indefinite"/></circle>
      <circle cx="800" cy="240" r="1.5"><animate attributeName="cy" values="270;10" dur="12s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="12s" begin="2s" repeatCount="indefinite"/></circle>
      <circle cx="880" cy="250" r="2.5"><animate attributeName="cy" values="270;30" dur="10s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="10s" begin="1s" repeatCount="indefinite"/></circle>
      <circle cx="940" cy="230" r="1.5"><animate attributeName="cy" values="270;40" dur="11s" begin="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="11s" begin="4s" repeatCount="indefinite"/></circle>
      <circle cx="650" cy="250" r="1.8"><animate attributeName="cy" values="270;15" dur="13s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="13s" begin="3s" repeatCount="indefinite"/></circle>
    </g>

    <!-- orbit ornament -->
    <g transform="translate(840 140)" fill="none" stroke="url(#accent)">
      <circle r="78" stroke-opacity="0.35" stroke-dasharray="2 8"/>
      <circle r="50" stroke-opacity="0.5"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
        <circle cx="78" cy="0" r="5" fill="#e8c872" stroke="none"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="11s" repeatCount="indefinite"/>
        <circle cx="50" cy="0" r="4" fill="#6ee7f9" stroke="none"/>
      </g>
      <text x="0" y="12" text-anchor="middle" fill="url(#accent)" stroke="none" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-style="italic">&lt;/&gt;</text>
    </g>

    <!-- eyebrow -->
    <text x="64" y="84" fill="#e8c872" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-size="13" letter-spacing="5" opacity="0">
      PORTFOLIO &#183; OPEN SOURCE &#183; CRAFT
      <animate attributeName="opacity" from="0" to="0.9" dur="1s" begin="0.2s" fill="freeze"/>
    </text>

    <!-- name -->
    <text x="64" y="150" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" letter-spacing="1" opacity="0">
      YOUR NAME
      <animate attributeName="opacity" from="0" to="1" dur="1.1s" begin="0.4s" fill="freeze"/>
      <animate attributeName="y" from="165" to="150" dur="1.1s" begin="0.4s" fill="freeze"/>
    </text>

    <!-- typed subtitle -->
    <g clip-path="url(#typed)">
      <text x="64" y="206" fill="url(#accent)" font-family="'SFMono-Regular', Consolas, 'Courier New', monospace" font-size="22">Software Engineer  /  Builder  /  Problem Solver</text>
    </g>
    <rect x="64" y="186" width="11" height="26" fill="#e8c872" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.1;0.5;0.51;1" dur="1s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="x" values="64;104;144;184;224;264;304;344;384;424;464;504;544;584;624;664;704" keyTimes="0;0.0625;0.125;0.1875;0.25;0.3125;0.375;0.4375;0.5;0.5625;0.625;0.6875;0.75;0.8125;0.875;0.9375;1" calcMode="discrete" dur="3.2s" begin="1.2s" fill="freeze"/>
    </rect>

    <!-- light sweep across the name -->
    <rect x="-300" y="95" width="220" height="70" fill="url(#sweep)" opacity="0.18" transform="skewX(-20)">
      <animate attributeName="x" values="-300;1100" dur="6s" begin="2s" repeatCount="indefinite"/>
    </rect>

    <!-- bottom accent line -->
    <rect x="0" y="274" width="1000" height="6" fill="url(#accent)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="0.5" y="0.5" width="999" height="279" rx="18" fill="none" stroke="url(#accent)" stroke-opacity="0.35"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
