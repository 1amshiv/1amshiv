<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 36" width="1200" height="36" role="presentation" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
  <style>
    .draw { stroke-dasharray: 1100; stroke-dashoffset: 1100; animation: draw 1.8s cubic-bezier(.65,0,.35,1) forwards; }
    .dot { animation: travel 9s ease-in-out infinite alternate; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes travel { from { transform: translateX(0); } to { transform: translateX(1080px); } }
  </style>
</defs>
<rect width="1200" height="36" fill="#0d1117"/>
<line class="draw" x1="60" y1="18" x2="1140" y2="18" stroke="#30363d"/>
<circle class="dot" cx="60" cy="18" r="3" fill="#7dcfff"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
