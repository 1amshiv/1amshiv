<svg width="800" height="300" viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f5a0"/>
      <stop offset="1" stop-color="#00d9f5"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-50%" width="120%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    text { font-family: 'Courier New', Courier, monospace; }
    .title { font-size: 18px; fill: #00f5a0; font-weight: bold; }
    .note  { font-size: 12px; fill: #8b949e; }
    .lbl   { font-size: 16px; fill: #e6edf3; }
    .pct   { font-size: 14px; fill: #00d9f5; opacity: 0; animation: fadein .5s forwards; }
    .track { fill: #161b22; stroke: #30363d; }
    .fill  { fill: url(#bar); transform-box: fill-box; transform-origin: left center; transform: scaleX(0);
             animation: grow 1.6s cubic-bezier(.2,.8,.2,1) forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
    @keyframes fadein { to { opacity: 1; } }
    .dot { fill: #fff; opacity: 0; animation: fadein .3s forwards, ping 1.8s ease-in-out infinite; }
    @keyframes ping { 0%,100% { r: 3; } 50% { r: 6; } }
  </style>

  <rect width="800" height="300" rx="12" fill="#0d1117" stroke="#30363d"/>
  <text class="title" x="30" y="38">&gt; stack.load()</text>
  <text class="note" x="770" y="38" text-anchor="end">// progress, not mastery</text>

  <!-- HTML 75 -->
  <text class="lbl" x="30" y="85">HTML</text>
  <rect class="track" x="160" y="68" width="520" height="14" rx="7"/>
  <rect class="fill" x="160" y="68" width="390" height="14" rx="7" filter="url(#glow)" style="animation-delay:.2s"/>
  <text class="pct" x="770" y="81" text-anchor="end" style="animation-delay:1.6s">75%</text>

  <!-- CSS 65 -->
  <text class="lbl" x="30" y="130">CSS</text>
  <rect class="track" x="160" y="113" width="520" height="14" rx="7"/>
  <rect class="fill" x="160" y="113" width="338" height="14" rx="7" filter="url(#glow)" style="animation-delay:.5s"/>
  <text class="pct" x="770" y="126" text-anchor="end" style="animation-delay:1.9s">65%</text>

  <!-- JS 50 -->
  <text class="lbl" x="30" y="175">JavaScript</text>
  <rect class="track" x="160" y="158" width="520" height="14" rx="7"/>
  <rect class="fill" x="160" y="158" width="260" height="14" rx="7" filter="url(#glow)" style="animation-delay:.8s"/>
  <text class="pct" x="770" y="171" text-anchor="end" style="animation-delay:2.2s">50%</text>

  <!-- Git 40 -->
  <text class="lbl" x="30" y="220">Git</text>
  <rect class="track" x="160" y="203" width="520" height="14" rx="7"/>
  <rect class="fill" x="160" y="203" width="208" height="14" rx="7" filter="url(#glow)" style="animation-delay:1.1s"/>
  <text class="pct" x="770" y="216" text-anchor="end" style="animation-delay:2.5s">40%</text>

  <!-- DSA 20 -->
  <text class="lbl" x="30" y="265">DSA</text>
  <rect class="track" x="160" y="248" width="520" height="14" rx="7"/>
  <rect class="fill" x="160" y="248" width="104" height="14" rx="7" filter="url(#glow)" style="animation-delay:1.4s"/>
  <circle class="dot" cx="264" cy="255" r="3" style="animation-delay:3s"/>
  <text class="pct" x="770" y="261" text-anchor="end" style="animation-delay:2.8s">20% ...</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
